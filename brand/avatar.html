<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 512x512 a sangre: X lo recorta en círculo y GitHub lo muestra cuadrado,
     así que el fondo llega a los bordes y la marca vive en el centro,
     dentro del círculo inscrito. */
  body {
    width: 512px; height: 512px; overflow: hidden;
    background: #101013;
    display: flex; align-items: center; justify-content: center;
  }
  .mark { display: flex; align-items: flex-end; gap: 18px; transform: translateY(6px); }
  .letter {
    font-family: 'Archivo Black', sans-serif;
    font-size: 340px; line-height: 0.74;
    color: #F7F6F2; letter-spacing: -0.02em;
  }
  .sq { width: 62px; height: 62px; background: #6B83FF; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="mark">
    <span class="letter">B</span>
    <span class="sq"></span>
  </div>
</body>
</html>
